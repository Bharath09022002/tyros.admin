<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Tyros Admin</title>

  <!-- PWA & Apple Home Screen Configuration -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#22201E">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tyros Admin">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">

  <!-- Typography: Barlow Condensed + Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Master Stylesheet -->
  <link rel="stylesheet" href="styles.css?v=1.2">
</head>
<body>

  <!-- Server Cold Start Indicator Banner -->
  <div id="server-banner"></div>

  <!-- Global Toasts Container -->
  <div id="toast-container"></div>

  <!-- Main Viewport Shell -->
  <div id="app-viewport">
    <div class="device-container">
      <!-- Dynamic View Container -->
      <main id="view-container"></main>

      <!-- Fixed Admin Bottom Navigation Bar -->
      <nav id="bottom-nav" style="display:none;">
        <a href="#/dashboard" class="nav-item" data-route="/dashboard">
          <div class="nav-dot"></div>
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7" rx="1.5"/>
            <rect x="14" y="3" width="7" height="7" rx="1.5"/>
            <rect x="14" y="14" width="7" height="7" rx="1.5"/>
            <rect x="3" y="14" width="7" height="7" rx="1.5"/>
          </svg>
          <span>Dashboard</span>
        </a>

        <a href="#/entries" class="nav-item" data-route="/entries">
          <div class="nav-dot"></div>
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="16" y1="13" x2="8" y2="13"/>
            <line x1="16" y1="17" x2="8" y2="17"/>
            <line x1="10" y1="9" x2="8" y2="9"/>
          </svg>
          <span>Entries</span>
        </a>

        <a href="#/reports" class="nav-item" data-route="/reports">
          <div class="nav-dot"></div>
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="20" x2="18" y2="10"/>
            <line x1="12" y1="20" x2="12" y2="4"/>
            <line x1="6" y1="20" x2="6" y2="14"/>
          </svg>
          <span>Report</span>
        </a>

        <a href="#/manage" class="nav-item" data-route="/manage">
          <div class="nav-dot"></div>
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/>
            <path d="M6 12H4a2 2 0 0 0-2 2v8h4"/>
            <path d="M18 9h2a2 2 0 0 1 2 2v11h-4"/>
            <path d="M10 6h4"/>
            <path d="M10 10h4"/>
            <path d="M10 14h4"/>
            <path d="M10 18h4"/>
          </svg>
          <span>Manage</span>
        </a>

        <a href="#/profile" class="nav-item" data-route="/profile">
          <div class="nav-dot"></div>
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          <span>Profile</span>
        </a>
      </nav>
    </div>
  </div>

  <!-- Master Application Script -->
  <script type="module" src="app.js"></script>
</body>
</html>
